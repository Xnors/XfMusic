[project]
name = "xfmusic"
version = "0.1.0"
description = "这是一个本地的基于用户喜好自动推荐的音乐播放器"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyboard>=0.13.5",
    "pygame>=2.6.1",
    "pysdl2>=0.9.17",
    "pysdl2-dll>=2.32.0",
    "tinytag>=2.1.1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pyinstaller>=6.14.1",
]
